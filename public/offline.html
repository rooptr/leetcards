<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e9" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; script-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Leetcards | Offline</title>
    <style>
      :root {
        color: #24231f;
        background: #f5f1e9;
        font-family: Aptos, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        margin: 0;
        min-height: 100dvh;
        padding: 32px;
        place-items: center;
      }
      main {
        border-top: 1px solid #d8d1c5;
        max-width: 620px;
        padding-top: 28px;
        width: 100%;
      }
      p { color: #706c63; line-height: 1.7; max-width: 52ch; }
      h1 {
        font-family: "Iowan Old Style", "Palatino Linotype", ui-serif, serif;
        font-size: clamp(42px, 10vw, 72px);
        font-weight: 400;
        letter-spacing: -0.05em;
        line-height: 0.98;
        margin: 0 0 24px;
      }
      a { color: #a7472f; text-underline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline.</h1>
      <p>
        Reopen a lesson you have already visited, or reconnect once to refresh
        the complete Leetcards library.
      </p>
      <a href="./">Try the library again</a>
    </main>
  </body>
</html>
